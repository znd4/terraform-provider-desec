# Builds the provider zips in the layout that OpenTofu expects:
#   terraform-provider-desec_<version>_<os>_<arch>.zip
#     terraform-provider-desec_v<version>
# scripts/publish-oci.sh pushes the zips to ghcr.io as an OCI provider mirror.
version: 2

project_name: terraform-provider-desec

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]
    ignore:
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
      - goos: freebsd
        goarch: arm
    binary: "{{ .ProjectName }}_v{{ .Version }}"

archives:
  - formats: [zip]
    # No Arm version in the name: OpenTofu uses <os>_<arch> only.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [none*]

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

changelog:
  use: github
  sort: asc

release:
  draft: false
