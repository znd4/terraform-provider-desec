# On a v* tag: build the zips with GoReleaser and make a GitHub release. Then
# publish-oci.yaml pushes the zips to ghcr.io as an OpenTofu OCI provider
# mirror.
name: release
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false # no cache in a release job (cache poisoning)
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: 1.13.9
          tofu_wrapper: false
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-oci:
    needs: goreleaser
    permissions:
      contents: read # download the release zips
      packages: write # push to ghcr.io
    uses: ./.github/workflows/publish-oci.yaml
    with:
      tag: ${{ github.ref_name }}
