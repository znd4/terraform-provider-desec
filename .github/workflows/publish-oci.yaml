# Push the zips of a GitHub release to ghcr.io/znd4/opentofu-provider-desec in
# the OpenTofu OCI provider mirror layout (scripts/publish-oci.sh).
#
# release.yaml calls this after each release. To publish an existing release
# again, run it by hand with the tag, for example v0.1.0.
name: publish-oci
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        type: string
        required: true

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read # download the release zips
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v2.0.4
        with:
          version: 1.3.5
      - name: Download the release zips
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --dir dist
      - name: Log in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GITHUB_TOKEN" | oras login ghcr.io -u "$ACTOR" --password-stdin
      - name: Push the OCI provider mirror
        env:
          TAG: ${{ inputs.tag }}
        run: scripts/publish-oci.sh "${TAG#v}" ghcr.io/znd4/opentofu-provider-desec dist
